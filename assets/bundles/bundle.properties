#Chronos
item.new-horizon-chronite.name = Chronite
item.new-horizon-chronite.description = A crystal that holds a sliver of stopped time. Made from silicon and graphite, which every planet has, so everything Chronos builds can be built anywhere.
item.new-horizon-paradox-core.name = Paradox Core
item.new-horizon-paradox-core.description = A core that exists in two moments at once. Made from chronite, phase fabric and thorium. Used to build the heaviest Chronos units and structures, and fired by the Event Horizon.

status.new-horizon-stasis.name = Stasis
status.new-horizon-stasis.description = Time has stopped for this unit. It cannot move or shoot.
status.new-horizon-temporal-freeze.name = Temporal Freeze
status.new-horizon-temporal-freeze.description = Heavily slowed, with sluggish weapons.
status.new-horizon-dissonance.name = Dissonance
status.new-horizon-dissonance.description = Weapons knocked offline, and slightly slowed.

block.new-horizon-temporal-foundry.name = Temporal Foundry
block.new-horizon-temporal-foundry.description = Presses silicon and graphite into chronite.
block.new-horizon-paradox-forge.name = Paradox Forge
block.new-horizon-paradox-forge.description = Folds chronite, phase fabric and thorium into paradox cores.
block.new-horizon-chrono-wall.name = Chrono Wall
block.new-horizon-chrono-wall.description = A wall that rewinds: if it takes no damage for 6 seconds it is back at full health.
block.new-horizon-chrono-wall-large.name = Large Chrono Wall
block.new-horizon-chrono-wall-large.description = A large wall that rewinds: if it takes no damage for 6 seconds it is back at full health.
block.new-horizon-stasis-tower.name = Stasis Tower
block.new-horizon-stasis-tower.description = Stops time for every enemy unit in range: they cannot move or shoot for as long as they stay there and the tower has power.
block.new-horizon-time-dilation-field.name = Time Dilation Field
block.new-horizon-time-dilation-field.description = A dome in which time runs slow for enemy bullets. They move at a quarter of their speed and last that much longer, so they take their time and still do not reach any further. Friendly bullets pass untouched.
block.new-horizon-chrono-accelerator.name = Chrono Accelerator
block.new-horizon-chrono-accelerator.description = A very large overdrive projector. Speeds up every block in range to 340%, and more with paradox cores.
block.new-horizon-arc-freezer.name = Arc Freezer
block.new-horizon-arc-freezer.description = Fires a bolt of cold that, on hitting a unit, arcs on to the nearest enemy units around it, one after the other, damaging and freezing every one of them.
block.new-horizon-dissonance-array.name = Dissonance Array
block.new-horizon-dissonance-array.description = Fires shots that knock the enemy turret, generator or shield they hit offline for 6 seconds. Ground and structure targets only.
block.new-horizon-event-horizon.name = Event Horizon
block.new-horizon-event-horizon.description = Lobs a shell that opens a black hole where it lands. For six seconds the hole drags enemy units in, swallows their bullets, and crushes whatever reaches its centre. Harmless to your own side.
block.new-horizon-chrono-relay.name = Chrono Relay
block.new-horizon-chrono-relay.description = Item teleporter. Whatever goes into one relay comes out of another relay set to the same channel, instantly and over any distance. Pick the channel by its colour.
block.new-horizon-warp-pad.name = Warp Pad
block.new-horizon-warp-pad.description = Unit teleporter. A friendly unit that stays on a pad for a moment is moved to another pad set to the same channel, wherever it is. Pick the channel by its colour.
block.new-horizon-temporal-fabricator.name = Temporal Fabricator
block.new-horizon-temporal-fabricator.description = Builds the Chronos units.

unit.new-horizon-nanobot.name = Nanobot
unit.new-horizon-nanobot.description = A tiny flier that heals the allied units around it, copies itself every 12 seconds (up to 18 at a time, each copy costs it a share of its health) and, when it dies, bursts into a cloud of cold that freezes every enemy around it.
unit.new-horizon-siphon.name = Siphon
unit.new-horizon-siphon.description = Drains enemy power grids in reach: it empties their batteries a pulse at a time, turns the energy into repairs for itself, and knocks the generators near it offline for a few seconds.
unit.new-horizon-dissonance.name = Dissonance
unit.new-horizon-dissonance.description = A gunship that hunts turrets. Its shots knock the turret they hit offline for 3 seconds.
unit.new-horizon-singularity.name = Singularity
unit.new-horizon-singularity.description = A heavy bomber. Every few seconds it drops a black hole bomb that drags enemy units in, swallows their bullets and crushes whatever reaches its centre.
ability.nh-replicate = Replicate
ability.nh-griddrain = Grid drain
command.nh-nano-heal = Heal

#Nukes
status.new-horizon-irradiated.name = Irradiated
status.new-horizon-irradiated.description = Radioactive fallout: slower movement. The zone it comes from takes a share of the target's maximum health every second.
status.new-horizon-emp-shock.name = EMP Shock
status.new-horizon-emp-shock.description = Hit by an electromagnetic pulse: nearly stopped, with weapons offline.

block.new-horizon-nuke-builder.name = Nuke Builder
block.new-horizon-nuke-builder.description = Builds inactive nukes and pushes them out of its front. Put a Nuke Launcher there and they roll straight in.
block.new-horizon-nuke-launcher.name = Nuke Launcher
block.new-horizon-nuke-launcher.description = A turret for nukes. Takes in an inactive nuke and turns it like a gun. Pick the target on the map from its menu and it turns to face it by itself; arm the nuke (turning it into its active form) and launch it. Control it like any turret (hold the control key and click it) to override the map target: it follows your cursor, holding fire arms the nuke and launches it straight along that heading, and letting go disarms it. When you leave, it goes back to the map target.
block.new-horizon-multi-nuke-launcher.name = Multi Nuke Launcher
block.new-horizon-multi-nuke-launcher.description = A Nuke Launcher with a magazine. Holds several inactive nukes side by side (four to start with) and arms them all together; once they are armed and facing the right way it launches them one after another in a quick salvo, each at the map target. It works like the single launcher: pick a target on the map, or control it like a turret to override the target; hold fire to arm and launch, and let go to disarm before the salvo starts. Its menu has an Upgrade button that adds a slot for items from the core, up to twenty; each slot costs more than the last, and the later ones need phase fabric too.
block.new-horizon-orbital-launcher.name = Orbital Launcher
block.new-horizon-orbital-launcher.description = A Nuke Launcher that holds one nuke at a time and throws it up to the edge of space. A nuke launched from here flies so high that nothing can target it or shoot it down on the way, so it gets to its target whatever defends it. Slow to arm and slow to recover. Works like the plain launcher: pick a target on the map, or control it like a turret.
block.new-horizon-tracking-radar.name = Tracking Radar
block.new-horizon-tracking-radar.description = Takes the high altitude off every enemy nuke in range (so that nukes thrown up by an Orbital Launcher can be targeted and shot at again) and marks every incoming active nuke with a red circle and its heading. It also puts each nuke it covers on the minimap and the full map, with a ring in the colour of its warhead, the way it is heading and the name of its kind, even where the fog of war would hide it. If the nuke has been given a target, its target is shown too: a line to it and the area its blast covers. (Only the host or a single player sees targets; other players see the nuke and its kind.) Needs power.
block.new-horizon-long-range-radar.name = Long-Range Radar
block.new-horizon-long-range-radar.description = A much bigger tracking radar: it reaches about two and a half times as far, and costs and draws much more power. It does everything the Tracking Radar does: takes the high altitude off enemy nukes in range, marks them in the world, and shows them, with their kind and targets, on the minimap and the full map.
block.new-horizon-cloak-projector.name = Cloak Projector
block.new-horizon-cloak-projector.description = Hides everything inside its circle from enemy launchers: they cannot pick a target there, a target that was already picked inside it is cleared, and nukes already flying at something inside it lose their target and fly on straight. Does nothing against nukes that were launched without a target. Needs power.
block.new-horizon-decoy-beacon.name = Decoy Beacon
block.new-horizon-decoy-beacon.description = Every enemy nuke that comes within range is forced to fly at the beacon, whatever it was aimed at, and goes off there. Put it somewhere harmless. Needs power; if it is destroyed or switched off the nukes go back to what they were doing, unless something else has taken their target.
block.new-horizon-nuke-jammer.name = Nuke Jammer
block.new-horizon-nuke-jammer.description = Enemy nukes in range lose their target for good and swerve about at random; they stop going off on what they meet, so they fly past, and only go off when their fuel runs out. Needs power.
block.new-horizon-nuke-interceptor.name = Nuke Interceptor
block.new-horizon-nuke-interceptor.description = A very fast, long-range turret that only shoots at active nukes. Its shot does no damage: a nuke it hits is switched off (it becomes its inactive form) and joins your team, where it can be armed, docked or flown into a launcher. It reloads quickly, so a miss costs little, but after it takes a nuke it is out of action for 25 seconds. A nuke with a mini form is simply neutralised. It cannot see nukes at high altitude: use a Tracking Radar. Needs power.

unit.new-horizon-nuke-explosive.name = Explosive Nuke (inactive)
unit.new-horizon-nuke-explosive.description = Turns fast and flies like a light unit. Cannot be detonated on purpose; if it is destroyed it makes a medium blast that hurts everything around it, allies included. Arm it in a Nuke Launcher to make it active. It can arm itself with the Arm command (or by firing while piloted), and fly into a launcher with the Enter Payload command.
unit.new-horizon-nuke-incendiary.name = Incendiary Nuke (inactive)
unit.new-horizon-nuke-incendiary.description = Turns fast and flies like a light unit. Cannot be detonated on purpose; if it is destroyed it makes a medium blast that hurts everything around it, allies included. Arm it in a Nuke Launcher to make it active. It can arm itself with the Arm command (or by firing while piloted), and fly into a launcher with the Enter Payload command.
unit.new-horizon-nuke-radiation.name = Radiation Nuke (inactive)
unit.new-horizon-nuke-radiation.description = Turns fast and flies like a light unit. Cannot be detonated on purpose; if it is destroyed it makes a medium blast that hurts everything around it, allies included. Arm it in a Nuke Launcher to make it active. It can arm itself with the Arm command (or by firing while piloted), and fly into a launcher with the Enter Payload command.
unit.new-horizon-nuke-emp.name = EMP Nuke (inactive)
unit.new-horizon-nuke-emp.description = Turns fast and flies like a light unit. Cannot be detonated on purpose; if it is destroyed it makes a medium blast that hurts everything around it, allies included. Arm it in a Nuke Launcher to make it active. It can arm itself with the Arm command (or by firing while piloted), and fly into a launcher with the Enter Payload command.
unit.new-horizon-nuke-explosive-active.name = Explosive Nuke
unit.new-horizon-nuke-explosive-active.description = Very fast, but it turns slowly and flies only the way it points. Detonates at its target, when it passes it, or when it comes close to anything of the enemy's. Can be detonated with the Detonate command, or by firing while piloted. Its blast is huge, ignores walls, and hurts everything in reach, allies included.
unit.new-horizon-nuke-incendiary-active.name = Incendiary Nuke
unit.new-horizon-nuke-incendiary-active.description = Very fast, but it turns slowly and flies only the way it points. Detonates at its target, when it passes it, or when it comes close to anything of the enemy's. Can be detonated with the Detonate command, or by firing while piloted. The blast sets everything around it on fire, structures too, splashes oil and slag over the ground, and leaves a burning patch for 10 seconds. It hurts allies too.
unit.new-horizon-nuke-radiation-active.name = Radiation Nuke
unit.new-horizon-nuke-radiation-active.description = Very fast, but it turns slowly and flies only the way it points. Detonates at its target, when it passes it, or when it comes close to anything of the enemy's. Can be detonated with the Detonate command, or by firing while piloted. Its damage is a share of what each target has, armor or not, allies included: the blast takes 15% of the maximum health of everything in reach at once, and the fallout it leaves for 25 seconds takes 3% of the maximum health of every unit inside it each second (2.5% for structures).
unit.new-horizon-nuke-emp-active.name = EMP Nuke
unit.new-horizon-nuke-emp-active.description = Very fast, but it turns slowly and flies only the way it points. Detonates at its target, when it passes it, or when it comes close to anything of the enemy's. Can be detonated with the Detonate command, or by firing while piloted. The pulse empties every battery in reach and switches off everything that runs on power for 15 seconds, on every side.
