unit.new-horizon-nuke-psychic.name = Psychic Nuke (inactive)
unit.new-horizon-nuke-psychic.description = Turns fast and flies like a light unit. Cannot be detonated on purpose; if it is destroyed it makes a medium blast that hurts everything around it, allies included, and nothing else happens. Arm it in a Nuke Launcher to make it active. When active: Every enemy unit in reach changes sides and fights for the nuke's team from then on. Nothing is damaged. Units somebody is flying are not taken. It can arm itself with the Arm command (or by firing while piloted), and fly into a launcher with the Enter Payload command.
unit.new-horizon-nuke-psychic-active.name = Psychic Nuke
unit.new-horizon-nuke-psychic-active.description = Very fast, but it turns slowly and flies only the way it points. Detonates at its target, when it passes it, or when it comes close to anything of the enemy's. Can be detonated with the Detonate command, or by firing while piloted. Every enemy unit in reach changes sides and fights for the nuke's team from then on. Nothing is damaged. Units somebody is flying are not taken.
unit.new-horizon-nuke-gravity.name = Gravity Nuke (inactive)
unit.new-horizon-nuke-gravity.description = Turns fast and flies like a light unit. Cannot be detonated on purpose; if it is destroyed it makes a medium blast that hurts everything around it, allies included, and nothing else happens. Arm it in a Nuke Launcher to make it active. When active: Drags every unit in reach, of any team, towards its centre for three seconds, and only then explodes. Hits everything, allies included. It can arm itself with the Arm command (or by firing while piloted), and fly into a launcher with the Enter Payload command.
unit.new-horizon-nuke-gravity-active.name = Gravity Nuke
unit.new-horizon-nuke-gravity-active.description = Very fast, but it turns slowly and flies only the way it points. Detonates at its target, when it passes it, or when it comes close to anything of the enemy's. Can be detonated with the Detonate command, or by firing while piloted. Drags every unit in reach, of any team, towards its centre for three seconds, and only then explodes. Hits everything, allies included.
unit.new-horizon-nuke-spatial.name = Spatial Nuke (inactive)
unit.new-horizon-nuke-spatial.description = Turns fast and flies like a light unit. Cannot be detonated on purpose; if it is destroyed it makes a medium blast that hurts everything around it, allies included, and nothing else happens. Arm it in a Nuke Launcher to make it active. When active: Every unit in reach, of any team, is sent to a random place on the map. Any place will do, even deep water. Nothing is damaged. It can arm itself with the Arm command (or by firing while piloted), and fly into a launcher with the Enter Payload command.
unit.new-horizon-nuke-spatial-active.name = Spatial Nuke
unit.new-horizon-nuke-spatial-active.description = Very fast, but it turns slowly and flies only the way it points. Detonates at its target, when it passes it, or when it comes close to anything of the enemy's. Can be detonated with the Detonate command, or by firing while piloted. Every unit in reach, of any team, is sent to a random place on the map. Any place will do, even deep water. Nothing is damaged.
unit.new-horizon-nuke-shockwave.name = Shockwave Nuke (inactive)
unit.new-horizon-nuke-shockwave.description = Turns fast and flies like a light unit. Cannot be detonated on purpose; if it is destroyed it makes a medium blast that hurts everything around it, allies included, and nothing else happens. Arm it in a Nuke Launcher to make it active. When active: The opposite of gravity: throws every unit in reach, of any team, away from its centre, and damages everything around it. Heavy units are thrown less. It can arm itself with the Arm command (or by firing while piloted), and fly into a launcher with the Enter Payload command.
unit.new-horizon-nuke-shockwave-active.name = Shockwave Nuke
unit.new-horizon-nuke-shockwave-active.description = Very fast, but it turns slowly and flies only the way it points. Detonates at its target, when it passes it, or when it comes close to anything of the enemy's. Can be detonated with the Detonate command, or by firing while piloted. The opposite of gravity: throws every unit in reach, of any team, away from its centre, and damages everything around it. Heavy units are thrown less.
unit.new-horizon-nuke-cluster.name = Cluster Nuke (inactive)
unit.new-horizon-nuke-cluster.description = Turns fast and flies like a light unit. Cannot be detonated on purpose; if it is destroyed it makes a medium blast that hurts everything around it, allies included, and nothing else happens. Arm it in a Nuke Launcher to make it active. When active: Fills every free, buildable tile in reach with a mine that belongs to the nuke's team. A mine explodes under an enemy ground unit, and when anything destroys it. Mines can be built over. It can arm itself with the Arm command (or by firing while piloted), and fly into a launcher with the Enter Payload command.
unit.new-horizon-nuke-cluster-active.name = Cluster Nuke
unit.new-horizon-nuke-cluster-active.description = Very fast, but it turns slowly and flies only the way it points. Detonates at its target, when it passes it, or when it comes close to anything of the enemy's. Can be detonated with the Detonate command, or by firing while piloted. Fills every free, buildable tile in reach with a mine that belongs to the nuke's team. A mine explodes under an enemy ground unit, and when anything destroys it. Mines can be built over.
unit.new-horizon-nuke-wall.name = Wall Nuke (inactive)
unit.new-horizon-nuke-wall.description = Turns fast and flies like a light unit. Cannot be detonated on purpose; if it is destroyed it makes a medium blast that hurts everything around it, allies included, and nothing else happens. Arm it in a Nuke Launcher to make it active. When active: Fills every free, buildable tile in reach with walls of the nuke's team. Select the nuke and pick the wall type with its stance buttons while it is inactive (one-tile walls only; copper if none is picked). It can arm itself with the Arm command (or by firing while piloted), and fly into a launcher with the Enter Payload command.
unit.new-horizon-nuke-wall-active.name = Wall Nuke
unit.new-horizon-nuke-wall-active.description = Very fast, but it turns slowly and flies only the way it points. Detonates at its target, when it passes it, or when it comes close to anything of the enemy's. Can be detonated with the Detonate command, or by firing while piloted. Fills every free, buildable tile in reach with walls of the nuke's team. Select the nuke and pick the wall type with its stance buttons while it is inactive (one-tile walls only; copper if none is picked).
unit.new-horizon-nuke-temporal.name = Temporal Nuke (inactive)
unit.new-horizon-nuke-temporal.description = Turns fast and flies like a light unit. Cannot be detonated on purpose; if it is destroyed it makes a medium blast that hurts everything around it, allies included, and nothing else happens. Arm it in a Nuke Launcher to make it active. When active: Freezes and disarms every unit in reach, and every turret, for three minutes. Allies included. Nothing is damaged. It can arm itself with the Arm command (or by firing while piloted), and fly into a launcher with the Enter Payload command.
unit.new-horizon-nuke-temporal-active.name = Temporal Nuke
unit.new-horizon-nuke-temporal-active.description = Very fast, but it turns slowly and flies only the way it points. Detonates at its target, when it passes it, or when it comes close to anything of the enemy's. Can be detonated with the Detonate command, or by firing while piloted. Freezes and disarms every unit in reach, and every turret, for three minutes. Allies included. Nothing is damaged.
unit.new-horizon-nuke-infantry.name = Infantry Nuke (inactive)
unit.new-horizon-nuke-infantry.description = Turns fast and flies like a light unit. Cannot be detonated on purpose; if it is destroyed it makes a medium blast that hurts everything around it, allies included, and nothing else happens. Arm it in a Nuke Launcher to make it active. When active: Carries a large force of units: while it is inactive, units can be loaded into it (the Load Units command, or by hand). When it goes off they are set down where it exploded. The blast itself hurts nothing. It can arm itself with the Arm command (or by firing while piloted), and fly into a launcher with the Enter Payload command.
unit.new-horizon-nuke-infantry-active.name = Infantry Nuke
unit.new-horizon-nuke-infantry-active.description = Very fast, but it turns slowly and flies only the way it points. Detonates at its target, when it passes it, or when it comes close to anything of the enemy's. Can be detonated with the Detonate command, or by firing while piloted. Carries a large force of units: while it is inactive, units can be loaded into it (the Load Units command, or by hand). When it goes off they are set down where it exploded. The blast itself hurts nothing.
unit.new-horizon-nuke-overload.name = Overload Nuke (inactive)
unit.new-horizon-nuke-overload.description = Turns fast and flies like a light unit. Cannot be detonated on purpose; if it is destroyed it makes a medium blast that hurts everything around it, allies included, and nothing else happens. Arm it in a Nuke Launcher to make it active. When active: Every unit in reach, of any team, explodes in a smaller blast of its own that does five times its health in damage to everything around it. The nuke itself does no damage. It can arm itself with the Arm command (or by firing while piloted), and fly into a launcher with the Enter Payload command.
unit.new-horizon-nuke-overload-active.name = Overload Nuke
unit.new-horizon-nuke-overload-active.description = Very fast, but it turns slowly and flies only the way it points. Detonates at its target, when it passes it, or when it comes close to anything of the enemy's. Can be detonated with the Detonate command, or by firing while piloted. Every unit in reach, of any team, explodes in a smaller blast of its own that does five times its health in damage to everything around it. The nuke itself does no damage.
unit.new-horizon-nuke-laser.name = Laser Nuke (inactive)
unit.new-horizon-nuke-laser.description = Turns fast and flies like a light unit. Cannot be detonated on purpose; if it is destroyed it makes a medium blast that hurts everything around it, allies included, and nothing else happens. Arm it in a Nuke Launcher to make it active. When active: Four meltdown lasers burn out from the centre for eight seconds while they turn slowly through a full circle. They burn everything in their way, allies included, and the blast itself does some damage. It can arm itself with the Arm command (or by firing while piloted), and fly into a launcher with the Enter Payload command.
unit.new-horizon-nuke-laser-active.name = Laser Nuke
unit.new-horizon-nuke-laser-active.description = Very fast, but it turns slowly and flies only the way it points. Detonates at its target, when it passes it, or when it comes close to anything of the enemy's. Can be detonated with the Detonate command, or by firing while piloted. Four meltdown lasers burn out from the centre for eight seconds while they turn slowly through a full circle. They burn everything in their way, allies included, and the blast itself does some damage.
unit.new-horizon-nuke-swarm.name = Swarm Nuke (inactive)
unit.new-horizon-nuke-swarm.description = Turns fast and flies like a light unit. Cannot be detonated on purpose; if it is destroyed it makes a medium blast that hurts everything around it, allies included, and nothing else happens. Arm it in a Nuke Launcher to make it active. When active: Three waves of homing missiles, a second apart, 120 missiles in each wave in a ring around the centre. They belong to the nuke's team and home in on its enemies. It can arm itself with the Arm command (or by firing while piloted), and fly into a launcher with the Enter Payload command.
unit.new-horizon-nuke-swarm-active.name = Swarm Nuke
unit.new-horizon-nuke-swarm-active.description = Very fast, but it turns slowly and flies only the way it points. Detonates at its target, when it passes it, or when it comes close to anything of the enemy's. Can be detonated with the Detonate command, or by firing while piloted. Three waves of homing missiles, a second apart, 120 missiles in each wave in a ring around the centre. They belong to the nuke's team and home in on its enemies.
unit.new-horizon-nuke-storm.name = Storm Nuke (inactive)
unit.new-horizon-nuke-storm.description = Turns fast and flies like a light unit. Cannot be detonated on purpose; if it is destroyed it makes a medium blast that hurts everything around it, allies included, and nothing else happens. Arm it in a Nuke Launcher to make it active. When active: Raises a tornado that drifts about for ten seconds. It burns every unit in reach, of any team, and tears at every structure in reach (most of all those it passes over), and now and then throws a bolt of lightning. Units it catches are dragged in, swung around it for a few seconds, which carries them a short way along with the tornado, and then thrown outward. Units too big to be carried are only pulled a little. The blast itself does no damage. It can arm itself with the Arm command (or by firing while piloted), and fly into a launcher with the Enter Payload command.
unit.new-horizon-nuke-storm-active.name = Storm Nuke
unit.new-horizon-nuke-storm-active.description = Very fast, but it turns slowly and flies only the way it points. Detonates at its target, when it passes it, or when it comes close to anything of the enemy's. Can be detonated with the Detonate command, or by firing while piloted. Raises a tornado that drifts about for ten seconds. It burns every unit in reach, of any team, and tears at every structure in reach (most of all those it passes over), and now and then throws a bolt of lightning. Units it catches are dragged in, swung around it for a few seconds, which carries them a short way along with the tornado, and then thrown outward. Units too big to be carried are only pulled a little. The blast itself does no damage.
unit.new-horizon-nuke-decoy.name = Decoy Nuke (inactive)
unit.new-horizon-nuke-decoy.description = Turns fast and flies like a light unit, but is far tougher than any other nuke, with heavy armor. Quick and cheap to build. Cannot be detonated on purpose; if it is destroyed it makes a medium blast that hurts everything around it, allies included, and breaks into three mini nukes. Arm it in a Nuke Launcher to make it active. It can arm itself with the Arm command (or by firing while piloted), and fly into a launcher with the Enter Payload command.
unit.new-horizon-nuke-decoy-active.name = Decoy Nuke
unit.new-horizon-nuke-decoy-active.description = Very fast, but it turns slowly and flies only the way it points. Heavily armored and tough, so it takes a lot of fire to bring down: send it ahead of other nukes to draw the defenses. When it is destroyed, reaches its target or is detonated, it breaks into three mini nukes, which fly off at whatever enemy is near. The break-up itself does no damage.
unit.new-horizon-nuke-mini-active.name = Mini Nuke
unit.new-horizon-nuke-mini-active.description = What a decoy nuke breaks into. Flies at the nearest enemy in sight, goes off when it gets close to anything of the enemy's, and burns out after a few seconds. Makes a small blast that hurts everything around it, allies included.
unit.new-horizon-nuke-lightning.name = Lightning Nuke (inactive)
unit.new-horizon-nuke-lightning.description = Turns fast and flies like a light unit. Cannot be detonated on purpose; if it is destroyed it makes a medium blast that hurts everything around it, allies included, and nothing else happens. Arm it in a Nuke Launcher to make it active. When active: Leaves a ball of light that hangs where it went off for ten seconds and, four times a second, strikes arcs of lightning at up to twenty units and structures around it, of any team, like an Aegis does. The blast itself does no damage. It can arm itself with the Arm command (or by firing while piloted), and fly into a launcher with the Enter Payload command.
unit.new-horizon-nuke-lightning-active.name = Lightning Nuke
unit.new-horizon-nuke-lightning-active.description = Very fast, but it turns slowly and flies only the way it points. Detonates at its target, when it passes it, or when it comes close to anything of the enemy's. Can be detonated with the Detonate command, or by firing while piloted. Leaves a ball of light that hangs where it went off for ten seconds and, four times a second, strikes arcs of lightning at up to twenty units and structures around it, of any team, like an Aegis does. The blast itself does no damage.
unit.new-horizon-nuke-quake.name = Quake Nuke (inactive)
unit.new-horizon-nuke-quake.description = Turns fast and flies like a light unit. Cannot be detonated on purpose; if it is destroyed it makes a medium blast that hurts everything around it, allies included, and nothing else happens. Arm it in a Nuke Launcher to make it active. When active: Shakes the ground for four seconds, a wave every quarter of a second, that takes a share of the maximum health of every structure in reach (most in the middle), armor or not. Hardly touches units: a few points of damage to those on the ground, which also stumble. The blast itself does no damage. It can arm itself with the Arm command (or by firing while piloted), and fly into a launcher with the Enter Payload command.
unit.new-horizon-nuke-quake-active.name = Quake Nuke
unit.new-horizon-nuke-quake-active.description = Very fast, but it turns slowly and flies only the way it points. Detonates at its target, when it passes it, or when it comes close to anything of the enemy's. Can be detonated with the Detonate command, or by firing while piloted. Shakes the ground for four seconds, a wave every quarter of a second, that takes a share of the maximum health of every structure in reach (most in the middle), armor or not. Hardly touches units: a few points of damage to those on the ground, which also stumble. The blast itself does no damage.
unit.new-horizon-nuke-scatter.name = Scatter Nuke (inactive)
unit.new-horizon-nuke-scatter.description = Turns fast and flies like a light unit. Cannot be detonated on purpose; if it is destroyed it makes a medium blast that hurts everything around it, allies included, and nothing else happens. Arm it in a Nuke Launcher to make it active. When active: Throws every structure in reach, of every team, to a random free place up to one and a half times the blast radius away, a few dozen a tick. Turret arcs, conveyor lines and power grids are broken up. Turrets, containers, tanks and batteries keep their ammo, items, liquid and charge; walls, conveyors and the like come out as fresh ones. Cores, unfinished structures and structures a player is flying stay put. The blast itself does no damage. It can arm itself with the Arm command (or by firing while piloted), and fly into a launcher with the Enter Payload command.
unit.new-horizon-nuke-scatter-active.name = Scatter Nuke
unit.new-horizon-nuke-scatter-active.description = Very fast, but it turns slowly and flies only the way it points. Detonates at its target, when it passes it, or when it comes close to anything of the enemy's. Can be detonated with the Detonate command, or by firing while piloted. Throws every structure in reach, of every team, to a random free place up to one and a half times the blast radius away, a few dozen a tick. Turret arcs, conveyor lines and power grids are broken up. Turrets, containers, tanks and batteries keep their ammo, items, liquid and charge; walls, conveyors and the like come out as fresh ones. Cores, unfinished structures and structures a player is flying stay put. The blast itself does no damage.
unit.new-horizon-nuke-magnet.name = Magnet Nuke (inactive)
unit.new-horizon-nuke-magnet.description = Turns fast and flies like a light unit. Cannot be detonated on purpose; if it is destroyed it makes a medium blast that hurts everything around it, allies included, and nothing else happens. Arm it in a Nuke Launcher to make it active. When active: Draws every structure in reach, of every team, in towards the centre, nearest first, to the free place nearest the middle, so that they pack together. Anything with nowhere closer to go stays. Turrets, containers, tanks and batteries keep their ammo, items, liquid and charge; walls, conveyors and the like come out as fresh ones. Cores, unfinished structures and structures a player is flying stay put. The blast itself does no damage. It can arm itself with the Arm command (or by firing while piloted), and fly into a launcher with the Enter Payload command.
unit.new-horizon-nuke-magnet-active.name = Magnet Nuke
unit.new-horizon-nuke-magnet-active.description = Very fast, but it turns slowly and flies only the way it points. Detonates at its target, when it passes it, or when it comes close to anything of the enemy's. Can be detonated with the Detonate command, or by firing while piloted. Draws every structure in reach, of every team, in towards the centre, nearest first, to the free place nearest the middle, so that they pack together. Anything with nowhere closer to go stays. Turrets, containers, tanks and batteries keep their ammo, items, liquid and charge; walls, conveyors and the like come out as fresh ones. Cores, unfinished structures and structures a player is flying stay put. The blast itself does no damage.
unit.new-horizon-nuke-hijack.name = Hijack Nuke (inactive)
unit.new-horizon-nuke-hijack.description = Turns fast and flies like a light unit. Cannot be detonated on purpose; if it is destroyed it makes a medium blast that hurts everything around it, allies included, and nothing else happens. Arm it in a Nuke Launcher to make it active. When active: Every structure of another team in reach changes sides, turrets included, and starts working for the nuke's team. Cores stay. The blast itself does no damage. It can arm itself with the Arm command (or by firing while piloted), and fly into a launcher with the Enter Payload command.
unit.new-horizon-nuke-hijack-active.name = Hijack Nuke
unit.new-horizon-nuke-hijack-active.description = Very fast, but it turns slowly and flies only the way it points. Detonates at its target, when it passes it, or when it comes close to anything of the enemy's. Can be detonated with the Detonate command, or by firing while piloted. Every structure of another team in reach changes sides, turrets included, and starts working for the nuke's team. Cores stay. The blast itself does no damage.
unit.new-horizon-nuke-scramble.name = Scramble Nuke (inactive)
unit.new-horizon-nuke-scramble.description = Turns fast and flies like a light unit. Cannot be detonated on purpose; if it is destroyed it makes a medium blast that hurts everything around it, allies included, and nothing else happens. Arm it in a Nuke Launcher to make it active. When active: Turns every rotating structure in reach (conveyors and the like) a random way round, and changes the settings of the rest: sorters and unloaders pick a random item, liquid sources a random liquid, bridges and power nodes unlink, factories forget what they were making. Nothing is damaged. It can arm itself with the Arm command (or by firing while piloted), and fly into a launcher with the Enter Payload command.
unit.new-horizon-nuke-scramble-active.name = Scramble Nuke
unit.new-horizon-nuke-scramble-active.description = Very fast, but it turns slowly and flies only the way it points. Detonates at its target, when it passes it, or when it comes close to anything of the enemy's. Can be detonated with the Detonate command, or by firing while piloted. Turns every rotating structure in reach (conveyors and the like) a random way round, and changes the settings of the rest: sorters and unloaders pick a random item, liquid sources a random liquid, bridges and power nodes unlink, factories forget what they were making. Nothing is damaged.
unit.new-horizon-nuke-sabotage.name = Sabotage Nuke (inactive)
unit.new-horizon-nuke-sabotage.description = Turns fast and flies like a light unit. Cannot be detonated on purpose; if it is destroyed it makes a medium blast that hurts everything around it, allies included, and nothing else happens. Arm it in a Nuke Launcher to make it active. When active: Empties every turret in reach of its ammo and sets off what is stored: ammo, and the contents of containers, tanks and batteries, blow up in proportion to how flammable and explosive they are, which can set off the next structure along. An emptied turret that held nothing dangerous is only shaken. The blast itself does no damage. It can arm itself with the Arm command (or by firing while piloted), and fly into a launcher with the Enter Payload command.
unit.new-horizon-nuke-sabotage-active.name = Sabotage Nuke
unit.new-horizon-nuke-sabotage-active.description = Very fast, but it turns slowly and flies only the way it points. Detonates at its target, when it passes it, or when it comes close to anything of the enemy's. Can be detonated with the Detonate command, or by firing while piloted. Empties every turret in reach of its ammo and sets off what is stored: ammo, and the contents of containers, tanks and batteries, blow up in proportion to how flammable and explosive they are, which can set off the next structure along. An emptied turret that held nothing dangerous is only shaken. The blast itself does no damage.
unit.new-horizon-nuke-breach.name = Breach Nuke (inactive)
unit.new-horizon-nuke-breach.description = Turns fast and flies like a light unit. Cannot be detonated on purpose; if it is destroyed it makes a medium blast that hurts everything around it, allies included, and nothing else happens. Arm it in a Nuke Launcher to make it active. When active: Cuts a narrow lane along the way it came: everything within about 18 pixels of a line running 700 pixels behind the point where it went off, and a little ahead of it, takes 6000 damage that ignores armor (500 for units). Aim it at something behind layered walls and it opens the way to it. The blast itself is small. It can arm itself with the Arm command (or by firing while piloted), and fly into a launcher with the Enter Payload command.
unit.new-horizon-nuke-breach-active.name = Breach Nuke
unit.new-horizon-nuke-breach-active.description = Very fast, but it turns slowly and flies only the way it points. Detonates at its target, when it passes it, or when it comes close to anything of the enemy's. Can be detonated with the Detonate command, or by firing while piloted. Cuts a narrow lane along the way it came: everything within about 18 pixels of a line running 700 pixels behind the point where it went off, and a little ahead of it, takes 6000 damage that ignores armor (500 for units). Aim it at something behind layered walls and it opens the way to it. The blast itself is small.
unit.new-horizon-nuke-devolve.name = Devolve Nuke (inactive)
unit.new-horizon-nuke-devolve.description = Turns fast and flies like a light unit. Cannot be detonated on purpose; if it is destroyed it makes a medium blast that hurts everything around it, allies included, and nothing else happens. Arm it in a Nuke Launcher to make it active. When active: Sends everything in reach, of every team, back down the tech tree. Units drop one tier, to the unit a reconstructor makes them from (a unit with none stays as it is, and nukes are not touched), keeping their health share. Walls of any size fall back to one-tile copper walls, conveyors and plastanium conveyors to basic conveyors, ducts to basic ducts, turrets to duos, mend projectors to menders, batteries to the small battery, and every power generator to a combustion generator. A structure bigger than one tile is replaced by a basic block on every tile it covered: a 2x2 wall becomes four copper walls and a 3x3 turret nine duos. The new structures are fresh: they lose what they held. Cores are not touched. The blast itself does no damage. It can arm itself with the Arm command (or by firing while piloted), and fly into a launcher with the Enter Payload command.
unit.new-horizon-nuke-devolve-active.name = Devolve Nuke
unit.new-horizon-nuke-devolve-active.description = Very fast, but it turns slowly and flies only the way it points. Detonates at its target, when it passes it, or when it comes close to anything of the enemy's. Can be detonated with the Detonate command, or by firing while piloted. Sends everything in reach, of every team, back down the tech tree. Units drop one tier, to the unit a reconstructor makes them from (a unit with none stays as it is, and nukes are not touched), keeping their health share. Walls fall back to copper walls, conveyors and plastanium conveyors to basic conveyors, ducts to basic ducts, turrets to duos, mend projectors to menders, batteries to the small battery, and every power generator to a combustion generator. A structure bigger than one tile is replaced by a basic block on every tile it covered: a 2x2 wall becomes four copper walls and a 3x3 turret nine duos. The new structures are fresh: they lose what they held. Cores are not touched. The blast itself does no damage.
unit.new-horizon-nuke-carrier.name = Nuke Carrier
unit.new-horizon-nuke-carrier.description = A ship that works as a mobile launcher and carries one nuke at a time, like a Nuke Launcher. An inactive nuke gets aboard by moving onto the ship (a player flying it takes over the ship, unless someone already has it). The Armed button keeps the nuke armed (it takes a few seconds). With the Launch nuke command selected, click a target and the ship fires the nuke there, arming it first if it was not armed yet; then it needs a few seconds to reload. Flown by a player, holding fire arms it and, once it is armed, launches it along the way the ship points; letting go disarms it. Built in the naval factory. Targets hidden by an enemy cloak are refused. A wall nuke keeps its wall type and an infantry nuke its passengers, which go back into it when it is launched; the passengers are let out if the ship is destroyed, and are not saved with the ship.
block.new-horizon-nuke-mine.name = Mine
block.new-horizon-nuke-mine.description = Laid by cluster nukes. Explodes under an enemy ground unit, and when anything destroys it. Cannot be built by hand; anything can be built over it.
status.new-horizon-tornado-caught.name = Caught in a tornado
status.new-horizon-tornado-caught.description = Cannot move or fly off on its own while a tornado has it.
status.new-horizon-temporal-lock.name = Temporal Lock
status.new-horizon-temporal-lock.description = Frozen in time: cannot move or shoot.
