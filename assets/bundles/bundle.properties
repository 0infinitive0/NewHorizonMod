# Jade Accord
item.new-horizon-verdant-resin.name = Verdant Resin
item.new-horizon-verdant-resin.description = Sticky resin tapped from spore pods. The basic building material of the Jade Accord, and a decent fuel.
item.new-horizon-jade-silk.name = Jade Silk
item.new-horizon-jade-silk.description = Resin spun into a light, resilient fibre. Used for advanced Jade structures, units and ammunition.
item.new-horizon-everbloom-core.name = Everbloom Core
item.new-horizon-everbloom-core.description = A dense knot of living energy that never wilts. Powers the Jade Accord's heaviest weapons.
status.new-horizon-bloom.name = Bloom
status.new-horizon-bloom.description = Spores take root in the target, slowing it, making it more vulnerable and slowly draining its health.
status.new-horizon-regrowth.name = Regrowth
status.new-horizon-regrowth.description = Living tissue knits back together, slowly restoring health and hardening the target.
block.new-horizon-resin-tapper.name = Resin Tapper
block.new-horizon-resin-tapper.description = Presses spore pods and water into verdant resin.
block.new-horizon-silk-loom.name = Silk Loom
block.new-horizon-silk-loom.description = Spins verdant resin and silicon into jade silk.
block.new-horizon-bloom-conservatory.name = Bloom Conservatory
block.new-horizon-bloom-conservatory.description = Cultivates jade silk, phase fabric and spore pods into everbloom cores.
block.new-horizon-spore-furnace.name = Spore Furnace
block.new-horizon-spore-furnace.description = Burns spore pods, verdant resin or other flammable items to generate power.
block.new-horizon-thorn-spitter.name = Thorn Spitter
block.new-horizon-thorn-spitter.description = Fires a spread of thorns that leave enemies blooming. Jade silk ammo pierces further and homes in.
block.new-horizon-briar-lance.name = Briar Lance
block.new-horizon-briar-lance.description = Charges and fires a piercing beam that blooms enemies and heals friendly buildings it passes through.
block.new-horizon-canopy-mortar.name = Canopy Mortar
block.new-horizon-canopy-mortar.description = Long range artillery. Shells burst into spores and thorns. Everbloom cores make them devastating.
block.new-horizon-jade-wall.name = Jade Wall
block.new-horizon-jade-wall.description = A wall that slowly regrows its health after it stops taking damage.
block.new-horizon-jade-wall-large.name = Large Jade Wall
block.new-horizon-jade-wall-large.description = A large wall that slowly regrows its health after it stops taking damage.
block.new-horizon-lifebloom-pylon.name = Lifebloom Pylon
block.new-horizon-lifebloom-pylon.description = Periodically mends nearby blocks. Jade silk boosts its range and healing.
block.new-horizon-jade-nursery.name = Jade Nursery
block.new-horizon-jade-nursery.description = Grows tier 1 Jade Accord units: Sprig, Wisp, Sporeling, Gardener, Herbalist, Scavenger and Bogguard.
block.new-horizon-verdant-cultivator.name = Verdant Cultivator
block.new-horizon-verdant-cultivator.description = Matures tier 1 Jade units into tier 2: Sprig to Thornback, Wisp to Luminar.
block.new-horizon-grove-cultivator.name = Grove Cultivator
block.new-horizon-grove-cultivator.description = Matures tier 2 Jade units into tier 3: Thornback to Briarlord, Luminar to Verdance.
unit.new-horizon-sprig.name = Sprig
unit.new-horizon-sprig.description = Light ground unit. Fires thorn needles that leave targets blooming.
unit.new-horizon-thornback.name = Thornback
unit.new-horizon-thornback.description = Medium ground unit with a thorn scattergun.
unit.new-horizon-briarlord.name = Briarlord
unit.new-horizon-briarlord.description = Heavy ground unit. Lobs spore mortars, fires thorn volleys and regrows nearby allies.
unit.new-horizon-wisp.name = Wisp
unit.new-horizon-wisp.description = Fast light air unit. Fires homing pollen seeds.
unit.new-horizon-luminar.name = Luminar
unit.new-horizon-luminar.description = Support air unit. Repairs allied units and grants them Regrowth; its bolts heal friendly buildings.
unit.new-horizon-verdance.name = Verdance
unit.new-horizon-verdance.description = Heavy air unit. Launches bloom missiles and radiates a spore field that harms enemies and mends allied structures.
status.new-horizon-infested.name = Infestation
status.new-horizon-infested.description = Never wears off. Drains health over time until the host dies or is healed back to full health. When an infested unit dies, it bursts into one Sporeling per 100 max health.
unit.new-horizon-sporeling.name = Sporeling
unit.new-horizon-sporeling.description = Suicide unit. Explodes on contact and infects everything caught in the blast. Infected enemies that die burst into more Sporelings, one per 100 max health. Hunts enemy units on its own and cannot be commanded. Harmless to buildings: it ignores them and does no damage to them. While idle it can be guided: with it selected, click the ground to make it wait there (it still goes for any enemy unit in reach) or click an enemy unit to make it attack that one first. Choosing Hunt again clears the orders.
block.new-horizon-spore-catapult.name = Spore Catapult
block.new-horizon-spore-catapult.description = Extreme range ground-only artillery that lobs pods of Sporelings at the enemy. Verdant resin pods carry 2, jade silk pods carry 4. The Sporelings hunt enemy units on their own after landing, but ignore buildings.
unit.new-horizon-gardener.name = Gardener
unit.new-horizon-gardener.description = Builder that learns. A fresh install is a plain builder; with experience it learns where fights happen and which blocks survive, and evolves from Seedling to Sprout, Sapling and Elder. Pips over the unit show its stage. Experience is shared by all Gardeners and kept between sessions. Use /gardener to see what it has learned.
ability.nh-gardener = Gardener Mind
command.nh-gardener = Garden
block.new-horizon-verdant-clinic.name = Verdant Clinic
block.new-horizon-verdant-clinic.description = Repairs damaged units in range, ground and air. Needs power. Idle, damaged Jade units walk here by themselves to heal and then return to where they were.
unit.new-horizon-herbalist.name = Herbalist
unit.new-horizon-herbalist.description = Support flier. Seeks out the most injured allied unit and hovers next to it, healing it and granting Regrowth. Waits by the core when nobody needs healing. Damaged idle Jade units also walk to it.
ability.nh-healseek = Self Care
command.nh-heal = Heal
unit.new-horizon-scavenger.name = Scavenger
unit.new-horizon-scavenger.description = Starts out weak, with a basic turret gun. Every enemy unit or block it helps destroy (it only has to take part) makes it tougher: it steals a random share of the victim's health and armor, without limit. Now and then it also walks away with one of the victim's weapons (suicide weapons excepted) or abilities. Weapons and abilities are unique: stealing one it already has improves it instead, one random stat each time (a gun's damage or fire rate, or one stat of an ability) by 10% of its base value, added on top rather than compounded. Shooting down a flyer may also teach it to fly, and sinking a boat to wade through deep water. Select it and use the Sacrifice command to have it consume the nearest friendly unit (one that is not piloted) and take one random weapon and one random ability of its kind. Stolen gear is kept in saves.
ability.nh-scavenger = Scavenger
unit.new-horizon-scavenger-amphibious.name = Scavenger (wading)
unit.new-horizon-scavenger-amphibious.description = A Scavenger that took the swimming of a boat it helped sink. It no longer drowns in deep water.
unit.new-horizon-scavenger-flying.name = Scavenger (winged)
unit.new-horizon-scavenger-flying.description = A Scavenger that took the wings of a flyer it helped shoot down.
command.nh-sacrifice = Sacrifice
unit.new-horizon-bogguard.name = Bogguard
unit.new-horizon-bogguard.description = Slow, heavily armored tank that soaks up a huge amount of damage. Spores love water: it heals about 5% of its max health per second while standing in water, and can wade through deep water without drowning.
ability.nh-waterregen = Water Regeneration
block.new-horizon-spore-waterwheel.name = Spore Waterwheel
block.new-horizon-spore-waterwheel.description = Turns a steady flow of water into power. Needs no fuel: a single mechanical pump on water feeds about one.
block.new-horizon-bloom-wall.name = Spore Wall
block.new-horizon-bloom-wall.description = Absorbs a huge amount of damage and heals itself, twice as fast on a water floor. Weak to fire: fiery shots hurt it much more and set it alight. A burning wall keeps burning, loses health that ignores armor, cannot heal and sets neighbouring spore walls alight, until its fire is put out, like any block's fire, by a liquid turret, water or cryofluid, or by rain. A wall on water cannot burn.
block.new-horizon-bloom-wall-large.name = Large Spore Wall
block.new-horizon-bloom-wall-large.description = A large spore wall. Absorbs a huge amount of damage and heals itself, but burns: see Spore Wall.
block.new-horizon-liquid-mass-driver.name = Liquid Mass Driver
block.new-horizon-liquid-mass-driver.description = Fires liquid in bolts to a linked Liquid Mass Driver, over walls, cliffs and enemy lines. Drivers with a link take liquid from conduits and fire once they hold enough and the receiver has room; the receiver pours it out into adjacent conduits. Only one liquid at a time, and what cannot be delivered splashes on the ground. Drivers can be chained.
block.new-horizon-contagion-spire.name = Contagion Spire
block.new-horizon-contagion-spire.description = Infects every enemy unit in range, ground or air, over and over. Runs on spore pods, water and power, each with a store sized alike: one full fill (40 pods, 5760 water, 34560 power) runs it 8 minutes until all are empty together. It charges its power store from the grid while not full and needs nothing from it after, uses nothing without a pod to burn, and stops as soon as any of the three runs out. It is the same infestation a Sporeling leaves: damage over time until the host dies, which bursts it into Sporelings for you (one per 100 max health), or until it is healed to full health, after which it is infected again if it is still in range. Does nothing to buildings.
bar.new-horizon-energy = Stored power: {0}/{1}
unit.new-horizon-mimic.name = Mimic
unit.new-horizon-mimic.description = Has no weapons. Next to any other unit, friendly or enemy, it turns into that kind of unit for good, with all of its weapons and abilities, but keeping only the health and armor of the Mimic. Select it and use the Mimic command to have it copy the closest unit worth copying, so where you leave it decides what it becomes; or pilot it and hold fire to copy the unit you aim at. Boats can only be copied while the Mimic is over water. A copy cannot copy again.
ability.nh-mimic = Mimic
command.nh-mimic = Mimic
status.new-horizon-mimicked.name = Mimicked
status.new-horizon-mimicked.description = Never wears off. This unit was a Mimic: it has the weapons and abilities of its new kind, but the health and armor of the Mimic.
command.nh-hunt = Hunt
nh.setting.nh_unit_info.name = Unit info panel
nh.setting.nh_unit_info.desc = Hold the Unit info key (I by default, change it in the controls) and click a unit to pin a docked panel with its health, armor, speed, weapons and abilities. What a Scavenger has stolen and what a Mimic has become is included.
